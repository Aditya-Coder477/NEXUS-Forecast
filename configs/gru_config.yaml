model:
  architecture: "GRU"
  input_size: 22
  hidden_size: 128
  num_layers: 2
  dropout: 0.2
  bidirectional: false
  history_length: 10
  forecast_horizons: [1, 3, 6]
  num_stages: 9

loss:
  state_weight: 1.0
  attack_weight: 1.0
  stage_weight: 0.5
  state_loss_type: "SmoothL1"

training:
  batch_size: 128
  epochs: 35
  learning_rate: 0.001
  weight_decay: 0.00001
  optimizer: "Adam"
  random_seed: 42
  early_stopping:
    enabled: true
    patience: 7
    monitor: "val_total_loss"

data:
  sequence_dir: "data/processed/forecast_sequences"
  datasets:
    - name: "CIC-IDS2017"
      file: "cic_ids2017_sequences.parquet"
    - name: "UNSW-NB15"
      file: "unsw_nb15_sequences.parquet"
    - name: "CTU-13"
      file: "ctu13_sequences.parquet"

output:
  model_dir: "models/world_model/gru"
  report_dir: "reports/world_model/gru"
  plots_dir: "reports/world_model/gru/plots"
