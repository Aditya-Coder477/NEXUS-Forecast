state_version: "1.0"
description: "Canonical 22-dimensional compact temporal network state vector S_t"

features:
  - name: "total_flows"
    type: "integer"
    aggregation: "count"
    source: "all_datasets"
    availability: "available"
    normalization: "log1p"

  - name: "unique_src_hosts"
    type: "integer"
    aggregation: "cardinality(src_ip)"
    source: "all_datasets"
    availability: "available"
    normalization: "log1p"

  - name: "unique_dst_hosts"
    type: "integer"
    aggregation: "cardinality(dst_ip)"
    source: "all_datasets"
    availability: "available"
    normalization: "log1p"

  - name: "unique_dst_ports"
    type: "integer"
    aggregation: "cardinality(dst_port)"
    source: "all_datasets"
    availability: "available"
    normalization: "log1p"

  - name: "unique_protocols"
    type: "integer"
    aggregation: "cardinality(protocol)"
    source: "all_datasets"
    availability: "available"
    normalization: "standard"

  - name: "total_packets"
    type: "integer"
    aggregation: "sum(packets_forward + packets_backward)"
    source: "all_datasets"
    availability: "available"
    normalization: "log1p"

  - name: "total_bytes"
    type: "integer"
    aggregation: "sum(bytes_forward + bytes_backward)"
    source: "all_datasets"
    availability: "available"
    normalization: "log1p"

  - name: "inbound_bytes"
    type: "integer"
    aggregation: "sum(bytes where dst_ip in monitored_subnet)"
    source: "all_datasets"
    availability: "available_via_boundary"
    normalization: "log1p"

  - name: "outbound_bytes"
    type: "integer"
    aggregation: "sum(bytes where src_ip in monitored_subnet)"
    source: "all_datasets"
    availability: "available_via_boundary"
    normalization: "log1p"

  - name: "inbound_outbound_ratio"
    type: "float"
    aggregation: "(inbound_bytes + 1) / (outbound_bytes + 1)"
    source: "all_datasets"
    availability: "available_via_boundary"
    normalization: "log10"

  - name: "mean_flow_duration"
    type: "float"
    aggregation: "mean(duration)"
    source: "all_datasets"
    availability: "available"
    normalization: "log1p"

  - name: "mean_packet_rate"
    type: "float"
    aggregation: "mean(packet_rate)"
    source: "all_datasets"
    availability: "available"
    normalization: "log1p"

  - name: "mean_byte_rate"
    type: "float"
    aggregation: "mean(byte_rate)"
    source: "all_datasets"
    availability: "available"
    normalization: "log1p"

  - name: "mean_iat"
    type: "float"
    aggregation: "mean(iat_mean)"
    source: "CIC-IDS2017, UNSW-NB15"
    availability: "partially_available"
    normalization: "standard"

  - name: "std_iat"
    type: "float"
    aggregation: "mean(iat_std)"
    source: "CIC-IDS2017, UNSW-NB15"
    availability: "partially_available"
    normalization: "standard"

  - name: "syn_count"
    type: "integer"
    aggregation: "sum(tcp_syn)"
    source: "all_datasets"
    availability: "available"
    normalization: "log1p"

  - name: "ack_count"
    type: "integer"
    aggregation: "sum(tcp_ack)"
    source: "all_datasets"
    availability: "available"
    normalization: "log1p"

  - name: "rst_count"
    type: "integer"
    aggregation: "sum(tcp_rst)"
    source: "all_datasets"
    availability: "available"
    normalization: "log1p"

  - name: "fin_count"
    type: "integer"
    aggregation: "sum(tcp_fin)"
    source: "all_datasets"
    availability: "available"
    normalization: "log1p"

  - name: "connection_failure_rate"
    type: "float"
    aggregation: "(rst_count + 1) / (syn_count + 1)"
    source: "all_datasets"
    availability: "available"
    normalization: "standard"

  - name: "unique_host_pair_count"
    type: "integer"
    aggregation: "cardinality((src_ip, dst_ip))"
    source: "all_datasets"
    availability: "available"
    normalization: "log1p"

  - name: "fan_out_ratio"
    type: "float"
    aggregation: "unique_dst_hosts / (unique_src_hosts + 1e-4)"
    source: "all_datasets"
    availability: "available"
    normalization: "log10"
